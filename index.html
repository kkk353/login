<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>登录表单</title>
</head>

<body>
  <form action="">
    <ul>
      <li>
        <label for="username">用户名：</label>
        <input type="text" placeholder="请输入用户名" id="username" name="username" accesskey="s" autocomplete="off" required>
      </li>
      <li>
        <label for="password">密码：</label>
        <input type="password" placeholder="请输入密码" id="password" name="password" maxlength="6" minlength="5" required>
      </li>
      <li>
        <input type="submit" value="登录">
      </li>
    </ul>
  </form>
</body>

</html>
